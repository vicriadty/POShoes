; PHP config tambahan untuk aplikasi.
memory_limit = 256M
memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 32M
max_execution_time = 240
max_input_time = 240
expose_php = Off
error_reporting = E_ALL
display_errors = Off
log_errors = On
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
date.timezone = UTC
