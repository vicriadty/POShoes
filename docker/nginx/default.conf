server {
    listen 80;
    server_name poshoes.local;
    root /app/public;
    index index.php;

    charset utf-8;

    # Frontend assets dari build Svelte/Vite
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Storage (foto, pdf) — hanya akses via aplikasi pada production
    location /storage/ {
        access_log off;
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 240;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
